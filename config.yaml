# config.yaml
# Currently using recorded video.
# When you are ready for CCTV, change the source line below
# and set RTSP_USER, RTSP_PASS, RTSP_HOST in Render Environment.

source: video.mp4

# Ready-to-use RTSP line (just uncomment and comment the video line above):
# source: "rtsp://\( {RTSP_USER}: \){RTSP_PASS}@${RTSP_HOST}:554/Streaming/Channels/101"

output: null
log: speed_log.csv
model: /app/yolov8n.pt
device: cpu
imgsz: 640
process_every: 1
display: false

camera:
  lane_width_m: 3.75
  num_lanes_left: 5
  num_lanes_right: 3
  bev_scale: 18
  visible_length_m: 70
  src_road_l: [[155, 415], [600, 395], [845, 1079], [0, 1079]]
  src_road_r: [[845, 395], [1140, 395], [1220, 1079], [900, 1079]]
  undistort:
    enabled: false
    camera_matrix: null
    dist_coeffs: null

tracking:
  tracker_yaml: bytetrack_custom.yaml
  min_track_frames: 8
  history_len: 25
  max_plausible_kph: 200
  min_plausible_kph: 2

speed_thresholds:
  green_kph: 60
  yellow_kph: 100

counting:
  enabled: true
  csv_path: vehicle_counts.csv

alerts:
  enabled: false
  speed_kph_threshold: 100
  webhook_url: null
  telegram_bot_token: null
  telegram_chat_id: null
  snapshot_dir: snapshots
  save_full_frame: true

recording:
  enabled: false
  output_dir: recordings
  segment_minutes: 60
  retention_days: 7