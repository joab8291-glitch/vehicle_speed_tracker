# ============================================================
# Render Blueprint - Webazi Vehicle Speed Tracker
# ============================================================

services:
  - type: web
    name: vehicle-speed-tracker

    runtime: docker

    dockerfilePath: ./Dockerfile

    plan: standard

    autoDeploy: true

    # IMPORTANT:
    # Do not use "/" because the dashboard requires authentication.
    healthCheckPath: /health

    envVars:

      # --------------------------------------------------------
      # CCTV
      # --------------------------------------------------------

      - key: RTSP_USER
        sync: false

      - key: RTSP_PASS
        sync: false

      - key: RTSP_HOST
        sync: false


      # --------------------------------------------------------
      # Dashboard authentication
      # --------------------------------------------------------

      - key: DASHBOARD_USER
        sync: false

      - key: DASHBOARD_PASS
        sync: false


      # --------------------------------------------------------
      # Telegram
      # --------------------------------------------------------

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false


      # --------------------------------------------------------
      # Persistent data paths
      # --------------------------------------------------------

      - key: SPEED_LOG_PATH
        value: /app/data/speed_log.csv

      - key: COUNTS_LOG_PATH
        value: /app/data/vehicle_counts.csv

      - key: ALERTS_LOG_PATH
        value: /app/data/alerts.csv

      - key: SNAPSHOT_DIR
        value: /app/data/snapshots


      # --------------------------------------------------------
      # Ultralytics
      # --------------------------------------------------------

      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics


    # ----------------------------------------------------------
    # Persistent disk
    # ----------------------------------------------------------

    disk:
      name: tracker-data

      mountPath: /app/data

      sizeGB: 10