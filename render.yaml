# ============================================================
# Render Blueprint - Webazi Vehicle Speed Tracker
# ============================================================

services:

  - type: web

    name: vehicle-speed-tracker

    runtime: docker

    dockerfilePath: ./Dockerfile

    plan: standard

    autoDeploy: true

    healthCheckPath: /health

    envVars:

      # ======================================================
      # CCTV
      # ======================================================

      - key: RTSP_USER
        sync: false

      - key: RTSP_PASS
        sync: false

      - key: RTSP_HOST
        sync: false


      # ======================================================
      # DASHBOARD AUTH
      # ======================================================

      - key: DASHBOARD_USER
        sync: false

      - key: DASHBOARD_PASS
        sync: false


      # ======================================================
      # TELEGRAM
      # ======================================================

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false


      # ======================================================
      # DATA
      # ======================================================

      - key: SPEED_LOG_PATH
        value: /app/data/speed_log.csv

      - key: COUNTS_LOG_PATH
        value: /app/data/vehicle_counts.csv

      - key: ALERTS_LOG_PATH
        value: /app/data/alerts.csv

      - key: SNAPSHOT_DIR
        value: /app/data/snapshots


      # ======================================================
      # PROCESSED VIDEO
      # ======================================================

      - key: VIDEO_PATH
        value: /app/data/output_speed.mp4

      - key: INPUT_VIDEO_PATH
        value: /app/video.mp4


      # ======================================================
      # ULTRALYTICS
      # ======================================================

      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics


    # ========================================================
    # PERSISTENT DISK
    # ========================================================

    disk:

      name: tracker-data

      mountPath: /app/data

      sizeGB: 10