# config.example.yaml
# Copy this to config.yaml and edit for your camera. Do NOT commit config.yaml
# with real credentials in it — use ${ENV_VAR} placeholders instead, and set
# those variables in your shell / Render environment / systemd EnvironmentFile.

# --- Video source ---------------------------------------------------------
# Recorded file:
#   source: video.mp4
# RTSP CCTV (credentials pulled from environment, never written here):
source: "rtsp://${RTSP_USER}:${RTSP_PASS}@${RTSP_HOST}:554/Streaming/Channels/101"
# USB webcam: source: 0

output: null            # non-live fallback filename; live runs use `recording:` below instead
log: speed_log.csv
model: yolov8n.pt
device: cpu              # cpu / cuda:0 / mps
imgsz: 640
process_every: 1         # process every Nth frame; raise to 2-3 on weak hardware
display: false            # true opens a live preview window (needs a display)

# --- Camera calibration ----------------------------------------------------
# Run: python calibrate_points.py --source "<your source>" --regions 2
# then paste the printed src_road_l / src_road_r arrays here.
camera:
  lane_width_m: 3.75
  num_lanes_left: 5
  num_lanes_right: 3
  bev_scale: 18
  visible_length_m: 70
  src_road_l: [[155, 415], [600, 395], [845, 1079], [0, 1079]]
  src_road_r: [[845, 395], [1140, 395], [1220, 1079], [900, 1079]]
  undistort:
    enabled: false        # set true only after a proper OpenCV camera calibration
    camera_matrix: null
    dist_coeffs: null

# --- Tracking ---------------------------------------------------------------
tracking:
  tracker_yaml: bytetrack_custom.yaml
  min_track_frames: 8
  history_len: 25
  max_plausible_kph: 200
  min_plausible_kph: 2

speed_thresholds:
  green_kph: 60
  yellow_kph: 100

counting:
  enabled: true
  csv_path: vehicle_counts.csv

# --- Alerts ------------------------------------------------------------------
alerts:
  enabled: false
  speed_kph_threshold: 100
  webhook_url: null                              # e.g. "${ALERT_WEBHOOK_URL}"
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"     # only read if alerts.enabled: true
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  snapshot_dir: snapshots
  save_full_frame: true

# --- Recording rotation & retention (24/7 live runs only) --------------------
recording:
  enabled: true
  output_dir: recordings
  segment_minutes: 60      # start a new video file every hour
  retention_days: 7        # delete segments older than this automatically
