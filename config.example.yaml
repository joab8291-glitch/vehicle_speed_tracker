# config.yaml
# Secrets are pulled from environment variables — never hard-code passwords/tokens here.
# Set these in Render → Environment:
#   RTSP_USER, RTSP_PASS, RTSP_HOST
#   (optional) TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, ALERT_WEBHOOK_URL

# --- Video source ---------------------------------------------------------
source: "rtsp://\( {RTSP_USER}: \){RTSP_PASS}@${RTSP_HOST}:554/Streaming/Channels/101"
# Alternatives:
# source: video.mp4
# source: 0                    # USB webcam

output: null
log: speed_log.csv
model: /app/yolov8n.pt         # path we baked into the Docker image
device: cpu
imgsz: 640
process_every: 1
display: false

# --- Camera calibration ----------------------------------------------------
# Replace these with the values from calibrate_points.py for YOUR camera
camera:
  lane_width_m: 3.75
  num_lanes_left: 5
  num_lanes_right: 3
  bev_scale: 18
  visible_length_m: 70
  src_road_l: [[155, 415], [600, 395], [845, 1079], [0, 1079]]
  src_road_r: [[845, 395], [1140, 395], [1220, 1079], [900, 1079]]
  undistort:
    enabled: false
    camera_matrix: null
    dist_coeffs: null

# --- Tracking ---------------------------------------------------------------
tracking:
  tracker_yaml: bytetrack_custom.yaml
  min_track_frames: 8
  history_len: 25
  max_plausible_kph: 200
  min_plausible_kph: 2

speed_thresholds:
  green_kph: 60
  yellow_kph: 100

counting:
  enabled: true
  csv_path: vehicle_counts.csv

# --- Alerts ------------------------------------------------------------------
alerts:
  enabled: false                       # set true when you want alerts
  speed_kph_threshold: 100
  webhook_url: "${ALERT_WEBHOOK_URL}"  # optional
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  snapshot_dir: snapshots
  save_full_frame: true

# --- Recording (24/7 live) --------------------------------------------------
recording:
  enabled: true
  output_dir: recordings
  segment_minutes: 60
  retention_days: 7